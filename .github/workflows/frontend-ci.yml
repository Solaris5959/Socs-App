name: Frontend CI

on:
  push:
    branches: [main, dev, chore/cypress-test]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Lint, Test, and Cypress

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Install backend and frontend dependencies
      - name: Install Backend
        run: npm ci
        working-directory: ./backend

      - name: Install Frontend
        run: npm ci
        working-directory: ./frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: ./frontend

      - name: Run Unit Tests
        run: npm test
        working-directory: ./frontend

      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          start: npm start # Cypress will automatically start your app if needed based on baseUrl
          wait-on: "http://localhost:3000" # Wait for frontend to be available
          build: npm run build # If your frontend require
        working-directory: ./frontend
