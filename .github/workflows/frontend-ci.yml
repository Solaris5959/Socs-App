# Todo: Fix cypress tests

name: Frontend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    name: Lint, Test, and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run ESLint (Next.js)
        run: npm run lint
        working-directory: ./frontend

      - name: Run Unit tests with Jest
        run: npm test
        working-directory: ./frontend

      # Install start-server-and-test
      - name: Install start-server-and-test
        run: npm install --save-dev start-server-and-test
        working-directory: ./frontend

      # Run E2E tests with both servers
      - name: Run Cypress E2E
        run: |
          npx start-server-and-test \
            "npm --prefix ../backend run start" http://localhost:5000 \
            "npm run dev" http://localhost:8080 \
            "cypress run"
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8080"
